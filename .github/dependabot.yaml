version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: next
    schedule:
      interval: daily
    # transitive dependencies are refreshed with `uv lock --upgrade` on esphome bump
    # esphome version is bumped manually together with ci.yaml and README
    ignore:
      - dependency-name: esphome
      - dependency-name: clang-format
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
