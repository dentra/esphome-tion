[project]
name = "esphome-tion"
version = "0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "black",
    "clang-format==13.0.1",
    "cmake",
    "esphome==2026.11.1",
    "jinja2-cli>=1.0.1",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false
# esphome 2026.11.1 has unsatisfiable metadata on macOS x86_64
# (aioesphomeapi 46.25.1 requires cryptography<49, esphome requires ==50.0.2)
environments = ["sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')"]

[tool.pytest.ini_options]
testpaths = ["tests/config", "tests/e2e"]
pythonpath = ["tests/e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-o cache_dir=build.tmp/pytest_cache"
