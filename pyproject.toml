[project]
name = "esphome-tion"
version = "0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
    "black",
    "cmake",
    "esphome==2026.9.1",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/config", "tests/e2e"]
pythonpath = ["tests/e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-o cache_dir=build.tmp/pytest_cache"
