number:
  # Агрессивность. Регулирует, насколько быстро система реагирует на изменения
  # уровня CO2. Значение от 1 до 5:
  #   1: Медленная реакция
  #   3: Средняя скорость реакции (по-умолчанию)
  #   5: Быстрая реакция
  - platform: template
    id: tion_auto_aggressiveness
    name: Auto Aggressiveness
    optimistic: true
    min_value: 1
    max_value: 5
    step: 1
    initial_value: 3
    mode: slider
    entity_category: config
    restore_value: true
  # Минимальный интервал. Минимальное время (в минутах) между изменениями
  # скорости, чтобы избежать слишком частых переключений.
  - platform: template
    id: tion_auto_min_time_delta
    name: Auto Min Time Delta
    icon: mdi:fan-clock
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 10
    mode: box
    entity_category: config
    unit_of_measurement: min
    restore_value: true
  # # Гистерезис.
  # - platform: template
  #   id: tion_auto_hysteresis
  #   name: Auto Hysteresis
  #   optimistic: true
  #   min_value: 0
  #   max_value: 100
  #   step: 1
  #   initial_value: 20
  #   mode: box
  #   entity_category: config
  #   unit_of_measurement: ppm
  #   restore_value: true
select:
  # Выбор алгоритма зависимости
  - platform: template
    id: tion_auto_alg
    name: Auto Algorithm
    optimistic: true
    options:
      - Линейный
      - Квадратичный
      - Экспоненциальный
    initial_option: Линейный
    entity_category: config
    restore_value: true

switch:
  # Переключение режима плавного изменения скорости.
  - platform: template
    id: tion_auto_use_ramping
    name: Auto Use Ramping
    icon: mdi:stairs
    optimistic: true
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

# Если текущий уровень CO2 отклоняется от целевого значения (setpoint),
# рассчитывается новая целевая скорость (new_speed) на основе следующих
# параметров:
#   Целевая скорость:
#     * Отклонение от целевого уровня CO2:
#       Чем больше отклонение, тем выше будет быть целевая скорость.
#     * Агрессивность управления (aggressiveness):
#       Этот параметр определяет, насколько быстро система реагирует на
#       изменения уровня CO2. Высокое значение агрессивности приводит к
#       более быстрому увеличению скорости, а низкое — наоборот.
#   Минимальный интервал между переключениями:
#     * Чтобы избежать слишком частых переключений скорости, алгоритм
#       учитывает минимальный интервал времени (min_time_delta) между
#       изменениями скорости.
#     * Если прошло меньше времени, чем указано в этом интервале, новая
#       целевая скорость игнорируется, даже если уровень CO2 изменился.
#     * Отключается установкой значения в 0.
#   Плавное изменение скорости (Ramping):
#     * После определения новой целевой скорости (new_speed), текущая скорость
#       (cur_speed) не меняется резко, а постепенно приближается к целевой с
#       использованием шага изменения (ramp_step).
#     * Каждую итерацию скорость изменяется на значение ramp_step в направлении
#       целевой скорости:
#         Если текущая скорость ниже целевой, она увеличивается на ramp_step.
#         Если текущая скорость выше целевой, она уменьшается на ramp_step.
#     * Этот процесс продолжается до тех пор, пока текущая скорость не достигнет
#       целевой.
#     * На текущий момент ramp_step всегда равен 1.
#     * Отключается через "Auto Use Ramping".
#   Ограничения скорости:
#     * Скорость вентилятора всегда ограничивается минимальным (min_speed) и
#       максимальным (max_speed) значениями, настроенными пользователем.
#     * Даже если расчет показывает необходимость выхода за эти пределы,
#       скорость будет автоматически корректироваться до допустимого диапазона.
#   Приоритет минимальной скорости:
#     * Если уровень CO2 возвращается в пределы целевой, алгоритм стремится
#       вернуть скорость вентилятора к минимальной (min_speed), даже если ранее
#       была установлена более высокая скорость.
#     * Если минимальная скорость 0, то минимальной будет считаться скорость 1,
#       до достижения целевой CO2.
#   Изменение параметров:
#     * После изменения параметров минимальной/максимальной скорости вентиляции,
#       целевого уровня CO2, скорость вентиляции будет сброшена до минимума в
#       рамках нового диапазона, но только при поступлении очередного значения
#       от датчика CO2.
tion:
  auto:
    lambda: |-
      // Текущие показания CO2
      const int co2_level = x;
      // Целевое значение CO2
      const int setpoint = id(tion_api).api()->get_auto_setpoint();
      // Агрессивность вентиляции
      const int aggressiveness = id(tion_auto_aggressiveness).state;
      // Минимальная скорость вентиляции
      int min_speed = id(tion_api).api()->get_auto_min_fan_speed();
      // Максимальная скорость вентиляции
      const int max_speed = id(tion_api).api()->get_auto_max_fan_speed();
      // Текущая скорость вентиляции, важно брать через метод чтобы учесть выкл бризер
      const int cur_speed = id(tion_api).api()->get_state().get_fan_speed();
      // Минимальное время переключения вентилятора в миллисекундах
      const uint32_t min_time_delta = uint32_t(id(tion_auto_min_time_delta).state) * 60000;
      // Доступное количество скоростей для изменения минус 1
      int spd_range = max_speed - min_speed;
      // Установка шага плавного изменения скорости
      constexpr int ramp_step = 1;
      // Использовать или нет, режим плавного изменения скорости
      const bool use_ramping = id(tion_auto_use_ramping).state;
      // Значение CO2 при котором скорость вентиляции должна включаться на максимум
      constexpr int co2_critical = 1200;
      // Гистерезис
      //int hysteresis = id(tion_auto_hysteresis).state;

      // Время последнего обновления скорости
      static uint32_t last_update_time = 0;

      ESP_LOGV("pkg_tion_auto_co2", "{ %d, %d, %d, %d, %d, %d, %" PRIu32 ", %" PRIu32 " }",
        co2_level, aggressiveness, min_speed, max_speed, cur_speed,
        int(min_time_delta / 60000), last_update_time, millis());

      // Проверим был ли сброс/изменение настроек
      if (co2_level == 0) {
        last_update_time = 0;
        return 0;
      }

      // Если доступна только одна скорость (не забываем про минус 1), то только ей и оперируем
      if (spd_range <=0) {
          return min_speed;
      }

      // Вычисление отклонения от целевого уровня CO2
      int deviation = co2_level - setpoint;

      // специальная обработка: если минимальная скорость 0
      if (min_speed == 0) {
        // то поддерживаем скорость 1, пока не достигнем целевой co2, но при условии что бризер еще работает
        if (cur_speed > 0 && deviation > 0) {
          min_speed++;
        }

        // дельта СО2 для включения бризера, зависящая от агресивности
        int max_deviation = (5 - aggressiveness) * 20 + 50;

        // https://t.me/esphome_tion/25792
        // (для предотвращения дерганины в околоцелевой зоне) если минимальная скорость 0 и текущая 0,
        // то включим бризер, если текущий СО2 превышает целевой на max_deviation
        if (cur_speed == 0 && deviation > max_deviation) {
          min_speed++;
        }
      }

      // Текущее время
      const uint32_t now = millis();

      // Если задано время обновления
      if (min_time_delta > 0) {
        // Если не было обновлений, например, старт esp, или случилось
        // переполнение, обновим время последнего обновления и выйдем,
        // ждем дополнительный вызов вместо переключения вентилятора
        if (last_update_time == 0 || last_update_time > now) {
          last_update_time = now;
          return std::clamp(cur_speed, min_speed, max_speed);
        }

        // Расчет временного интервала
        uint32_t time_delta = now - last_update_time;

        // Если прошло меньше времени, то оставляем текущую скорость
        if (time_delta < min_time_delta) {
          return std::clamp(cur_speed, min_speed, max_speed);
        }
      }

      // Новая скорость вентилятора, минимальная по-умолчанию
      int new_speed = min_speed;

      // Изменяем скорость если есть отклонения в большую сторону
      if (deviation > 0) {
        auto alg = id(tion_auto_alg).active_index();
        if (*alg == 0) {
          // Линейный расчет
          // Рассчитываем корректировку скорости на основе отклонения и агрессивности
            int adj_factor = (deviation / (float)setpoint) * aggressiveness * spd_range;
            int adj_speed = min_speed + adj_factor;
            // Применим расчетную скорость
            new_speed = adj_speed;
        } else {
          // новый алгоритм
          auto co2_derivative = 1.0f;

          auto co2_max = co2_critical; // co2_critical - co2_critical_hysteresis;
          auto co2_target = setpoint; // setpoint + setpoint_hysteresis;
          auto co2_deviation = deviation; // co2_level - co2_target;

          float co2_range = co2_max - co2_target;

          float ratio = co2_deviation / co2_range; // линейно
          if (*alg == 2) { // квадратично
            ratio = std::pow(ratio, 2.0f);
          } else if (*alg == 3) { // экспоненциально
            ratio = std::exp(ratio) - 1.0f;
          }
          ratio = std::clamp(ratio, 0.0f, 1.0f);

          float base_aggression = 6.0f / aggressiveness;
          float dynamic_aggression = base_aggression; // base_aggression * (1.0f + 0.3f * co2_derivative);
          float speed = min_speed + dynamic_aggression * spd_range * ratio;

          new_speed = std::round(speed);
        }
      }

      // Если доступен режим плавного изменения скорости
      if (use_ramping) {
        // Плавно изменяем текущую скорость
        new_speed = std::clamp(new_speed, cur_speed - ramp_step, cur_speed + ramp_step);
      }

      // Ограничиваем скорость допустимым диапазоном
      new_speed = std::clamp(new_speed, min_speed, max_speed);

      // Если скорость изменилась, то обновим время последнего переключения
      if (cur_speed != new_speed) {
        last_update_time = now;
      }

      // Вернем новую скорость вентиляции
      return new_speed;

