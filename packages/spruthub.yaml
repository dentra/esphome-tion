substitutions:
  time_platform: sntp
  mqtt_port: 4444

esphome:
  build_flags:
    # Включаем поддержку работы со SprutHub
    - -DTION_SPRUTHUB_SUPPORT

mqtt:
  discovery: false
  publish_nan_as_none: false

declaration:
  - lambda: |-
      #ifdef TION_PKG_SPRUTHUB_INCLUDED
        #error Package spruthub.yaml already included
      #else
        #define TION_PKG_SPRUTHUB_INCLUDED
      #endif

      #ifndef TION_PKG_MQTT_INCLUDED
        #error Please enable package mqtt.yaml before spruthub.yaml
      #endif

# SprutHub template "(.*)/climate/(.*)/mode/state" takes device name from the climate object_id.
# Climate without own name (as configs had before 2025-01-21) uses friendly_name for name and object_id.
# Do not use !remove, entity without name becomes internal.
climate:
  - id: !extend tion_climate
    name: None
